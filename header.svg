<svg fill="none" viewBox="0 0 1200 320" width="1200" height="320" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        @keyframes gradient {
          0% { background-position: 0% 50%; }
          50% { background-position: 100% 50%; }
          100% { background-position: 0% 50%; }
        }

        @keyframes fadeUp {
          from { opacity: 0; transform: translateY(16px); }
          to { opacity: 1; transform: translateY(0); }
        }

        @keyframes expandLine {
          from { transform: scaleX(0); }
          to { transform: scaleX(1); }
        }

        @keyframes pulse {
          0%, 100% { opacity: 0.3; }
          50% { opacity: 1; }
        }

        @keyframes float {
          0%, 100% { transform: translate(-50%, -52%); }
          50% { transform: translate(-50%, -48%); }
        }

        .banner {
          width: 100%;
          height: 320px;
          background: #0d1117;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;
          position: relative;
          overflow: hidden;
        }

        .gradient-bg {
          position: absolute;
          inset: 0;
          background: linear-gradient(-45deg, #667eea18, #764ba218, #c471f518, #667eea18);
          background-size: 400% 400%;
          animation: gradient 12s ease infinite;
        }

        .grid {
          position: absolute;
          inset: 0;
          background-image: radial-gradient(#667eea10 1px, transparent 1px);
          background-size: 28px 28px;
        }

        .glow {
          position: absolute;
          width: 600px;
          height: 280px;
          background: radial-gradient(ellipse at center, #667eea12, transparent 70%);
          top: 50%;
          left: 50%;
          transform: translate(-50%, -50%);
          animation: float 6s ease-in-out infinite;
        }

        .content {
          position: relative;
          z-index: 1;
          display: flex;
          flex-direction: column;
          align-items: center;
        }

        .line {
          width: 64px;
          height: 2px;
          background: linear-gradient(90deg, #667eea, #764ba2);
          border-radius: 1px;
          margin-bottom: 16px;
          animation: expandLine 0.8s ease-out 0.2s both;
        }

        .name {
          font-size: 52px;
          font-weight: 800;
          letter-spacing: -2px;
          line-height: 1.1;
          background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #c471f5 100%);
          -webkit-background-clip: text;
          background-clip: text;
          -webkit-text-fill-color: transparent;
          color: transparent;
          animation: fadeUp 0.6s ease-out 0.1s both;
        }

        .role {
          font-size: 15px;
          color: #6e7681;
          letter-spacing: 5px;
          text-transform: uppercase;
          margin-top: 14px;
          font-weight: 500;
          animation: fadeUp 0.6s ease-out 0.4s both;
        }

        .dots {
          display: flex;
          gap: 8px;
          margin-top: 20px;
          animation: fadeUp 0.6s ease-out 0.6s both;
        }

        .dot {
          width: 5px;
          height: 5px;
          border-radius: 50%;
          animation: pulse 2.5s ease-in-out infinite;
        }

        .dot:nth-child(1) { background: #667eea; }
        .dot:nth-child(2) { background: #764ba2; animation-delay: 0.4s; }
        .dot:nth-child(3) { background: #c471f5; animation-delay: 0.8s; }

        @media (prefers-color-scheme: light) {
          .banner { background: #ffffff; }
          .gradient-bg {
            background: linear-gradient(-45deg, #667eea0a, #764ba20a, #c471f50a, #667eea0a);
            background-size: 400% 400%;
            animation: gradient 12s ease infinite;
          }
          .grid { background-image: radial-gradient(#667eea08 1px, transparent 1px); }
          .glow { background: radial-gradient(ellipse at center, #667eea0a, transparent 70%); }
          .role { color: #57606a; }
        }

        @media (prefers-reduced-motion) {
          .gradient-bg, .dot, .glow { animation: none; }
          .name, .role, .line, .dots { animation: none; opacity: 1; }
          .line { transform: scaleX(1); }
          .glow { transform: translate(-50%, -50%); }
        }
      </style>
      <div class="banner">
        <div class="gradient-bg"></div>
        <div class="grid"></div>
        <div class="glow"></div>
        <div class="content">
          <div class="line"></div>
          <div class="name">Kanish Khanna</div>
          <div class="role">Systems · AI Infrastructure · Performance</div>
          <div class="dots">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
          </div>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
